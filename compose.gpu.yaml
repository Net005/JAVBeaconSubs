services:
  javbeaconsubs:
    build:
      args:
        WHISPER_CPP_REF: "${WHISPER_CPP_REF:-f049fff95a089aa9969deb009cdd4892b3e74916}"
        CUDA_ARCHITECTURES: "${CUDA_ARCHITECTURES:-75;86}"
        WHISPER_BUILD_JOBS: "${WHISPER_BUILD_JOBS:-2}"
    environment:
      JAVBEACONSUBS_USE_GPU: "true"
      JAVBEACONSUBS_GPU_PREFLIGHT: "true"
      JAVBEACONSUBS_GPU_AUTO_RESET: "${JAVBEACONSUBS_GPU_AUTO_RESET:-false}"
      JAVBEACONSUBS_GPU_FALLBACK_CPU: "${JAVBEACONSUBS_GPU_FALLBACK_CPU:-true}"
    gpus: all
