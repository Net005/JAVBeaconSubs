name: javbeaconsubs

services:
  javbeaconsubs:
    build:
      context: .
      args:
        WHISPER_CPP_REF: "${WHISPER_CPP_REF:-f049fff95a089aa9969deb009cdd4892b3e74916}"
        CUDA_ARCHITECTURES: "${CUDA_ARCHITECTURES:-75;86}"
        WHISPER_BUILD_JOBS: "${WHISPER_BUILD_JOBS:-2}"
        REAZONSPEECH_REF: "${REAZONSPEECH_REF:-8be654dc9ba8d205759d9d93fe717ae37f321b01}"
    image: "${JAVBEACONSUBS_IMAGE:-ghcr.io/net005/javbeaconsubs:latest}"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    ports:
      - "${SUBTITLE_PORT:-8097}:${SUBTITLE_PORT:-8097}"
    environment:
      SUBTITLE_PORT: "${SUBTITLE_PORT:-8097}"
      JAVBEACONSUBS_LISTEN: "0.0.0.0:${SUBTITLE_PORT:-8097}"
      JAVBEACONSUBS_API_TOKEN: "${JAVBEACONSUBS_API_TOKEN:-}"
      JAVBEACONSUBS_WEB_USERNAME: "${JAVBEACONSUBS_WEB_USERNAME:-}"
      JAVBEACONSUBS_WEB_PASSWORD: "${JAVBEACONSUBS_WEB_PASSWORD:-}"
      JAVBEACONSUBS_TRANSLATION_API_KEY: "${JAVBEACONSUBS_TRANSLATION_API_KEY:-}"
      JAVBEACONSUBS_ASR_BACKEND: "${JAVBEACONSUBS_ASR_BACKEND:-reazon}"
      JAVBEACONSUBS_REAZON_MODEL: "${JAVBEACONSUBS_REAZON_MODEL:-reazon-research/reazonspeech-nemo-v2}"
      JAVBEACONSUBS_DOWNLOAD_MODELS: "${JAVBEACONSUBS_DOWNLOAD_MODELS:-true}"
      JAVBEACONSUBS_USE_GPU: "true"
      JAVBEACONSUBS_GPU_PREFLIGHT: "true"
      JAVBEACONSUBS_GPU_AUTO_RESET: "${JAVBEACONSUBS_GPU_AUTO_RESET:-false}"
      JAVBEACONSUBS_GPU_FALLBACK_CPU: "${JAVBEACONSUBS_GPU_FALLBACK_CPU:-true}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-}"
      GID: "${GID:-}"
      GUID: "${GUID:-}"
      UMASK: "${UMASK:-0002}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${JAVBEACONSUBS_DATA_PATH:-./data}:/data"
      - "${JAVBEACONSUBS_MODELS_PATH:-./models}:/models"
      - "${JAVBEACONSUBS_SCRIPTS_PATH:-./scripts}:/scripts:ro"
      - "${MEDIA_PATH:-./media}:/media"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --header \"Authorization: Bearer $${JAVBEACONSUBS_API_TOKEN}\" http://127.0.0.1:$${SUBTITLE_PORT}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15m
