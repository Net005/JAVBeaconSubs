services:
  javbeacon-subs:
    build:
      context: .
      args:
        WHISPER_IMAGE: ghcr.io/ggml-org/whisper.cpp:main-cuda
    image: "${BEACONSUBS_IMAGE:-ghcr.io/net005/javbeacon-subs:latest}"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    ports:
      - "${SUBTITLE_PORT:-8097}:8097"
    environment:
      BEACONSUBS_API_TOKEN: "${BEACONSUBS_API_TOKEN:-}"
      BEACONSUBS_TRANSLATION_API_KEY: "${BEACONSUBS_TRANSLATION_API_KEY:-}"
      BEACONSUBS_DOWNLOAD_MODELS: "${BEACONSUBS_DOWNLOAD_MODELS:-true}"
      BEACONSUBS_USE_GPU: "true"
      BEACONSUBS_GPU_PREFLIGHT: "true"
      BEACONSUBS_GPU_AUTO_RESET: "${BEACONSUBS_GPU_AUTO_RESET:-true}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - javbeacon_subs_data:/data
      - "./models:/models"
      - "${MEDIA_PATH:-./media}:/media"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --header \"Authorization: Bearer $${BEACONSUBS_API_TOKEN}\" http://127.0.0.1:8097/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15m

volumes:
  javbeacon_subs_data:
