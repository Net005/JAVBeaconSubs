name: javbeaconsubs

services:
  javbeaconsubs:
    build:
      context: .
      args:
        WHISPER_IMAGE: ghcr.io/ggml-org/whisper.cpp:main-cuda
    image: "${JAVBEACONSUBS_IMAGE:-ghcr.io/net005/javbeaconsubs:latest}"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    ports:
      - "${SUBTITLE_PORT:-8097}:${SUBTITLE_PORT:-8097}"
    environment:
      SUBTITLE_PORT: "${SUBTITLE_PORT:-8097}"
      JAVBEACONSUBS_LISTEN: "0.0.0.0:${SUBTITLE_PORT:-8097}"
      JAVBEACONSUBS_API_TOKEN: "${JAVBEACONSUBS_API_TOKEN:-}"
      JAVBEACONSUBS_TRANSLATION_API_KEY: "${JAVBEACONSUBS_TRANSLATION_API_KEY:-}"
      JAVBEACONSUBS_DOWNLOAD_MODELS: "${JAVBEACONSUBS_DOWNLOAD_MODELS:-true}"
      JAVBEACONSUBS_USE_GPU: "true"
      JAVBEACONSUBS_GPU_PREFLIGHT: "true"
      JAVBEACONSUBS_GPU_AUTO_RESET: "${JAVBEACONSUBS_GPU_AUTO_RESET:-true}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${JAVBEACONSUBS_DATA_PATH:-./data}:/data"
      - "${JAVBEACONSUBS_MODELS_PATH:-./models}:/models"
      - "${MEDIA_PATH:-./media}:/media"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --header \"Authorization: Bearer $${JAVBEACONSUBS_API_TOKEN}\" http://127.0.0.1:$${SUBTITLE_PORT}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15m
